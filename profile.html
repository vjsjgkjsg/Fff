<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DC_ROOT — Профиль</title>
  <style>
    :root {
      --bg: #03000a;
      --surface: rgba(15,10,35,0.65);
      --border: rgba(180,130,255,0.25);
      --primary: #b47aff;
      --secondary: #ff3b6f;
      --accent: #00e5ff;
      --text: #f0eaff;
      --muted: #9a8abf;
      --radius: 22px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      font-family: var(--font);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    canvas#particles {
      position: fixed;
      top:0; left:0;
      width:100%; height:100%;
      z-index:0;
      pointer-events:none;
    }
    .container {
      max-width:480px;
      margin:0 auto;
      padding:20px 16px 100px;
      position:relative;
      z-index:1;
      text-align:center;
    }
    .nav {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:12px 0 24px;
      position:sticky;
      top:0;
      background: rgba(3,0,10,0.8);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      z-index:10;
      border-bottom:1px solid var(--border);
    }
    .logo {
      font-size:1.7rem;
      font-weight:900;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 8px rgba(180,130,255,0.4));
    }
    .nav-links a {
      color: var(--muted);
      text-decoration:none;
      font-weight:700;
      font-size:0.85rem;
      margin-left:16px;
      transition:0.3s;
      text-transform:uppercase;
    }
    .coming-soon {
      margin-top:80px;
      font-size:2rem;
      font-weight:900;
      text-transform:uppercase;
      background: linear-gradient(to right, #fff, #ffb3c6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 12px rgba(255,59,111,0.5));
    }
    .bottom-nav {
      position:fixed;
      bottom:0; left:0; right:0;
      display:flex;
      justify-content:space-around;
      background: rgba(5,0,15,0.9);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-top:1px solid var(--border);
      padding:10px 0 20px;
      z-index:20;
      max-width:480px;
      margin:0 auto;
    }
    .bottom-nav a {
      text-decoration:none;
      color:var(--muted);
      font-size:0.65rem;
      font-weight:700;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:4px;
      text-transform:uppercase;
    }
    .bottom-nav a.active { color:var(--secondary); text-shadow:0 0 12px var(--secondary); }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="container">
    <nav class="nav">
      <div class="logo">DC_ROOT</div>
      <div class="nav-links">
        <a href="index.html">Главная</a>
        <a href="product.html">Услуги</a>
        <a href="zakaz.html">Заказ</a>
      </div>
    </nav>
    <div class="coming-soon">👤 ПРОФИЛЬ<br><span style="font-size:1rem; color:var(--muted);">Скоро здесь будет твой личный кабинет</span></div>
  </div>
  <div class="bottom-nav">
    <a href="index.html"><span>🏠</span> Главная</a>
    <a href="product.html"><span>📦</span> Услуги</a>
    <a href="zakaz.html"><span>✍️</span> Заказ</a>
    <a href="comand.html"><span>👥</span> Команда</a>
  </div>
  <script>
    (function() {
      const canvas=document.getElementById('particles');
      const ctx=canvas.getContext('2d');
      let particles=[];
      const resize=()=>{ canvas.width=window.innerWidth; canvas.height=window.innerHeight; };
      window.addEventListener('resize',resize);
      resize();
      class Particle {
        constructor(){ this.reset(); }
        reset(){ this.x=Math.random()*canvas.width; this.y=Math.random()*canvas.height; this.size=Math.random()*2+0.5; this.speedX=(Math.random()-0.5)*0.4; this.speedY=(Math.random()-0.5)*0.4; this.opacity=Math.random()*0.5+0.2; }
        update(){ this.x+=this.speedX; this.y+=this.speedY; if(this.x<0||this.x>canvas.width||this.y<0||this.y>canvas.height) this.reset(); }
        draw(){ ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fillStyle=`rgba(180,130,255,${this.opacity})`; ctx.fill(); }
      }
      for(let i=0;i<60;i++) particles.push(new Particle());
      function animate(){ ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p=>{ p.update(); p.draw(); }); requestAnimationFrame(animate); }
      animate();
    })();
  </script>
</body>
</html>
